<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">Cadet programme against self-sponsored training</text>
<rect x="64" y="146" width="1072" height="40" fill="#eef3ef"/><text x="356.72" y="173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">Cadet programme</text><text x="753.36" y="173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">Self-sponsored</text><line x1="64" y1="186" x2="1136" y2="186" stroke="#d8e0da" stroke-width="1"/><text x="78" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Who selects you</text><text x="356.72" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">The airline, before training</text><text x="753.36" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Nobody; you choose the school</text><rect x="64" y="264" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="264" x2="1136" y2="264" stroke="#d8e0da" stroke-width="1"/><text x="78" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Where you train</text><text x="356.72" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">A school the airline chose</text><text x="753.36" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Any DGCA-approved FTO</text><line x1="64" y1="342" x2="1136" y2="342" stroke="#d8e0da" stroke-width="1"/><text x="78" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Cost</text><text x="356.72" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Not published by the airline</text><text x="753.36" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Quoted to you, component by component</text><rect x="64" y="420" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="420" x2="1136" y2="420" stroke="#d8e0da" stroke-width="1"/><text x="78" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">If you are not selected</text><text x="356.72" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">You are not in the programme</text><text x="753.36" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">There is no gate to fail</text>
<text x="64" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: IndiGo careers page, retrieved 10 September 2026</text>
</svg>