<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Cadet programme against self-sponsored training">
<rect width="1200" height="556" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f6f43"/>
<text x="64" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">Cadet programme against self-sponsored training</text>
<rect x="64" y="128" width="1072" height="40" fill="#eef3ef"/><text x="356.72" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">Cadet programme</text><text x="753.36" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">Self-sponsored</text><line x1="64" y1="168" x2="1136" y2="168" stroke="#d8e0da" stroke-width="1"/><text x="78" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Who selects you</text><text x="356.72" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">The airline, before training</text><text x="753.36" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Nobody; you choose the school</text><rect x="64" y="246" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="246" x2="1136" y2="246" stroke="#d8e0da" stroke-width="1"/><text x="78" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Where you train</text><text x="356.72" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">A school the airline chose</text><text x="753.36" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Any DGCA-approved FTO</text><line x1="64" y1="324" x2="1136" y2="324" stroke="#d8e0da" stroke-width="1"/><text x="78" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Cost</text><text x="356.72" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Not published by the airline</text><text x="753.36" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Quoted to you, component by component</text><rect x="64" y="402" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="402" x2="1136" y2="402" stroke="#d8e0da" stroke-width="1"/><text x="78" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">If you are not selected</text><text x="356.72" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">You are not in the programme</text><text x="753.36" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">There is no gate to fail</text>
<text x="64" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: IndiGo careers page, retrieved 10 September 2026</text>
</svg>