<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="What DGCA requires before a CPL, in order">
<rect width="1200" height="620" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f6f43"/>
<text x="64" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">What DGCA requires before a CPL, in order</text>
<circle cx="86" cy="152" r="22" fill="#1f6f43"/><text x="86" y="159" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="86" y1="176" x2="86" y2="218" stroke="#d8e0da" stroke-width="2"/><text x="130" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">10+2 with Physics and Mathematics</text><text x="130" y="175" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Chemistry is not required</text><circle cx="86" cy="240" r="22" fill="#1f6f43"/><text x="86" y="247" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="86" y1="264" x2="86" y2="306" stroke="#d8e0da" stroke-width="2"/><text x="130" y="238" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">Class 1 medical</text><text x="130" y="263" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">The cheapest step that can end the plan</text><circle cx="86" cy="328" r="22" fill="#1f6f43"/><text x="86" y="335" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><line x1="86" y1="352" x2="86" y2="394" stroke="#d8e0da" stroke-width="2"/><text x="130" y="326" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">DGCA computer number</text><text x="130" y="351" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Nothing can be booked without it</text><circle cx="86" cy="416" r="22" fill="#1f6f43"/><text x="86" y="423" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><line x1="86" y1="440" x2="86" y2="482" stroke="#d8e0da" stroke-width="2"/><text x="130" y="414" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">Theory papers at 70%</text><text x="130" y="439" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Each paper separately, no aggregate</text><circle cx="86" cy="504" r="22" fill="#1f6f43"/><text x="86" y="511" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="130" y="502" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">Flying hours at an approved FTO</text><text x="130" y="527" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Schedule II, Aircraft Rules 1937</text>
<text x="64" y="586" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: CAR Section 7, Series B, Part I</text>
</svg>