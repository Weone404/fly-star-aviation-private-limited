<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 638" width="1200" height="638" role="img" aria-label="What DGCA requires before a CPL, in order">
<rect width="1200" height="638" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="8" fill="#1f6f43"/>
<rect x="64" y="46" width="54" height="5" rx="2.5" fill="#b7791f"/>
<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">What DGCA requires before a CPL, in order</text>
<circle cx="86" cy="170" r="22" fill="#1f6f43"/><text x="86" y="177" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><line x1="86" y1="194" x2="86" y2="236" stroke="#d8e0da" stroke-width="2"/><text x="130" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">10+2 with Physics and Mathematics</text><text x="130" y="193" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Chemistry is not required</text><circle cx="86" cy="258" r="22" fill="#1f6f43"/><text x="86" y="265" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><line x1="86" y1="282" x2="86" y2="324" stroke="#d8e0da" stroke-width="2"/><text x="130" y="256" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">Class 1 medical</text><text x="130" y="281" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">The cheapest step that can end the plan</text><circle cx="86" cy="346" r="22" fill="#1f6f43"/><text x="86" y="353" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><line x1="86" y1="370" x2="86" y2="412" stroke="#d8e0da" stroke-width="2"/><text x="130" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">DGCA computer number</text><text x="130" y="369" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Nothing can be booked without it</text><circle cx="86" cy="434" r="22" fill="#1f6f43"/><text x="86" y="441" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><line x1="86" y1="458" x2="86" y2="500" stroke="#d8e0da" stroke-width="2"/><text x="130" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">Theory papers at 70%</text><text x="130" y="457" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Each paper separately, no aggregate</text><circle cx="86" cy="522" r="22" fill="#1f6f43"/><text x="86" y="529" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="130" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#123524" text-anchor="start">Flying hours at an approved FTO</text><text x="130" y="545" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Schedule II, Aircraft Rules 1937</text>
<text x="64" y="604" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: CAR Section 7, Series B, Part I</text>
</svg>