<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 514" width="1200" height="514" role="img" aria-label="How long a passed DGCA paper stays valid">
<rect width="1200" height="514" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="8" fill="#1f6f43"/>
<rect x="64" y="46" width="54" height="5" rx="2.5" fill="#b7791f"/>
<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">How long a passed DGCA paper stays valid</text>
<text x="64" y="132" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5b52" text-anchor="start">years from the date of passing</text><line x1="254" y1="170" x2="254" y2="434" stroke="#d8e0da" stroke-width="1"/><text x="254" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b52" text-anchor="middle">0</text><line x1="422.4" y1="170" x2="422.4" y2="434" stroke="#d8e0da" stroke-width="1"/><text x="422.4" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b52" text-anchor="middle">1</text><line x1="590.8" y1="170" x2="590.8" y2="434" stroke="#d8e0da" stroke-width="1"/><text x="590.8" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b52" text-anchor="middle">2</text><line x1="759.2" y1="170" x2="759.2" y2="434" stroke="#d8e0da" stroke-width="1"/><text x="759.2" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b52" text-anchor="middle">3</text><line x1="927.6" y1="170" x2="927.6" y2="434" stroke="#d8e0da" stroke-width="1"/><text x="927.6" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b52" text-anchor="middle">4</text><line x1="1096" y1="170" x2="1096" y2="434" stroke="#d8e0da" stroke-width="1"/><text x="1096" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a5b52" text-anchor="middle">5</text><text x="64" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#123524" text-anchor="start">PPL paper</text><rect x="254" y="196" width="421" height="34" rx="4" fill="#1f6f43"/><text x="689" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">two and a half years</text><text x="64" y="316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#123524" text-anchor="start">CPL paper</text><rect x="254" y="292" width="842" height="34" rx="4" fill="#1f6f43"/><text x="1082" y="316" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="end">five years</text><text x="64" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#123524" text-anchor="start">ATPL paper</text><rect x="254" y="388" width="842" height="34" rx="4" fill="#1f6f43"/><text x="1082" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ffffff" text-anchor="end">five years</text>
<text x="64" y="480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: CAR Section 7, Series B, Part I</text>
</svg>