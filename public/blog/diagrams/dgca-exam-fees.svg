<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="What DGCA actually publishes about exam fees">
<rect width="1200" height="700" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="8" fill="#1f6f43"/>
<rect x="64" y="46" width="54" height="5" rx="2.5" fill="#b7791f"/>
<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">What DGCA actually publishes about exam fees</text>
<rect x="64" y="150" width="1072" height="168" rx="8" fill="#f6e6c8"/><text x="100" y="234" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#123524" text-anchor="start">Rs 2,500</text><text x="100" y="270" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#4a5b52" text-anchor="start">per paper, Flight Crew Licence online examination</text><line x1="64" y1="338" x2="1136" y2="338" stroke="#d8e0da" stroke-width="1"/><text x="64" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#123524" text-anchor="start">Refunds</text><text x="464" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5b52" text-anchor="start">Not refundable under any circumstances, including a</text><text x="464" y="386" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5b52" text-anchor="start">rejected form</text><line x1="64" y1="408" x2="1136" y2="408" stroke="#d8e0da" stroke-width="1"/><text x="64" y="434" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#123524" text-anchor="start">OLODE fee</text><text x="464" y="434" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5b52" text-anchor="start">No separate figure published by DGCA</text><line x1="64" y1="478" x2="1136" y2="478" stroke="#d8e0da" stroke-width="1"/><text x="64" y="504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#123524" text-anchor="start">Computer number fee</text><text x="464" y="504" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5b52" text-anchor="start">Not mentioned</text><line x1="64" y1="548" x2="1136" y2="548" stroke="#d8e0da" stroke-width="1"/><text x="64" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#123524" text-anchor="start">Four CPL papers, first time</text><text x="464" y="574" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a5b52" text-anchor="start">Rs 10,000</text>
<text x="64" y="666" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: DGCA; legal basis Rule 48, Aircraft Rules 1937</text>
</svg>