<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Why an ATPL is not a first licence">
<rect width="1200" height="556" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f6f43"/>
<text x="64" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">Why an ATPL is not a first licence</text>
<rect x="64" y="128" width="1072" height="40" fill="#eef3ef"/><text x="356.72" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">CPL</text><text x="753.36" y="155" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">ATPL</text><line x1="64" y1="168" x2="1136" y2="168" stroke="#d8e0da" stroke-width="1"/><text x="78" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Prerequisite licence</text><text x="356.72" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">None</text><text x="753.36" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Must already hold an Indian CPL</text><rect x="64" y="246" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="246" x2="1136" y2="246" stroke="#d8e0da" stroke-width="1"/><text x="78" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Typical stage</text><text x="356.72" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Entry to commercial flying</text><text x="753.36" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Held while already flying commercially</text><line x1="64" y1="324" x2="1136" y2="324" stroke="#d8e0da" stroke-width="1"/><text x="78" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Theory papers</text><text x="356.72" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Four subject areas</text><text x="753.36" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Five subject areas plus an oral</text><rect x="64" y="402" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="402" x2="1136" y2="402" stroke="#d8e0da" stroke-width="1"/><text x="78" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Flying experience</text><text x="356.72" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Schedule II minimum</text><text x="753.36" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Schedule II, substantially greater</text>
<text x="64" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: CAR Section 7, Series B, Part I</text>
</svg>