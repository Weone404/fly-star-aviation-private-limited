<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 658" width="1200" height="658" role="img" aria-label="How DGCA scores a flying training organisation">
<rect width="1200" height="658" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="8" fill="#1f6f43"/>
