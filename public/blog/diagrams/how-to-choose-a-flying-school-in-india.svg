<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="How DGCA scores a flying training organisation">
<rect width="1200" height="640" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f6f43"/>
<text x="64" y="82" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">How DGCA scores a flying training organisation</text>
<text x="64" y="166" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Operational aspects</text><text x="64" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">student, instructor and engineer</text><text x="64" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">ratios, fleet, simulator</text><rect x="364" y="146" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="146" width="702" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="168" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">40%</text><text x="64" y="254" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">FTO performance</text><text x="64" y="276" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">time to 175 hours, utilisation,</text><text x="64" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">completion ratio</text><rect x="364" y="234" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="234" width="351" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="256" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">20%</text><text x="64" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Safety standards</text><text x="64" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">accidents 18, incidents 2</text><rect x="364" y="322" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="322" width="351" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="344" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">20%</text><text x="64" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Compliance</text><text x="64" y="452" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">Level-I observations, breath</text><text x="64" y="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">analyser</text><rect x="364" y="410" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="410" width="175.5" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">10%</text><text x="64" y="518" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Assistance to students</text><text x="64" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">grievances, finance, placement,</text><text x="64" y="558" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">fee transparency</text><rect x="364" y="498" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="498" width="175.5" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="520" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">10%</text>
<text x="64" y="606" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: DGCA Public Notice F. No: DGCA-16017/10/2025-DFT</text>
