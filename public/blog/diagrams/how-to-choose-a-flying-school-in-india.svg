<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">How DGCA scores a flying training organisation</text>
<text x="64" y="184" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Operational aspects</text><text x="64" y="206" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">student, instructor and engineer</text><text x="64" y="224" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">ratios, fleet, simulator</text><rect x="364" y="164" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="164" width="702" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="186" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">40%</text><text x="64" y="272" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">FTO performance</text><text x="64" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">time to 175 hours, utilisation,</text><text x="64" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">completion ratio</text><rect x="364" y="252" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="252" width="351" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="274" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">20%</text><text x="64" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Safety standards</text><text x="64" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">accidents 18, incidents 2</text><rect x="364" y="340" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="340" width="351" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="362" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">20%</text><text x="64" y="448" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Compliance</text><text x="64" y="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">Level-I observations, breath</text><text x="64" y="488" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">analyser</text><rect x="364" y="428" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="428" width="175.5" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">10%</text><text x="64" y="536" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#123524" text-anchor="start">Assistance to students</text><text x="64" y="558" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">grievances, finance, placement,</text><text x="64" y="576" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a5b52" text-anchor="start">fee transparency</text><rect x="364" y="516" width="702" height="30" rx="4" fill="#eef3ef"/><rect x="364" y="516" width="175.5" height="30" rx="4" fill="#1f6f43"/><text x="1080" y="538" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#123524" text-anchor="start">10%</text>
<text x="64" y="624" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: DGCA Public Notice F. No: DGCA-16017/10/2025-DFT</text>
