<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title description">
  <title id="title">A pilot-training pathway in India</title>
  <desc id="description">Five stages: education and eligibility, DGCA medical assessment, theory examinations, flight training at an FTO, and licence and career planning.</desc>
  <rect width="1200" height="675" fill="#f7f9f7"/>
  <rect width="1200" height="8" fill="#1f6f43"/>
  <text x="64" y="82" fill="#123524" font-family="Arial, sans-serif" font-size="34" font-weight="700">A pilot-training pathway in India</text>
  <text x="64" y="120" fill="#4a5b52" font-family="Arial, sans-serif" font-size="18">Check each current requirement before committing to a training route.</text>
  <line x1="152" y1="322" x2="1048" y2="322" stroke="#b7c8bb" stroke-width="4"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="64" y="190" width="196" height="264" rx="18" fill="#fff" stroke="#d8e0da" stroke-width="2"/>
      <circle cx="162" cy="270" r="38" fill="#eef3ef"/>
      <path d="M143 270h38M162 251v38" stroke="#1f6f43" stroke-width="5" stroke-linecap="round"/>
      <text x="162" y="350" fill="#123524" font-size="19" font-weight="700">Eligibility</text>
      <text x="162" y="382" fill="#4a5b52" font-size="15">Education and</text>
      <text x="162" y="404" fill="#4a5b52" font-size="15">documents</text>
    </g>
    <g>
      <rect x="292" y="190" width="196" height="264" rx="18" fill="#fff" stroke="#d8e0da" stroke-width="2"/>
      <circle cx="390" cy="270" r="38" fill="#eef3ef"/>
      <path d="M390 245c-13 0-22 10-22 22 0 18 22 34 22 34s22-16 22-34c0-12-9-22-22-22zm0 15a7 7 0 1 1 0 14 7 7 0 0 1 0-14z" fill="#1f6f43"/>
      <text x="390" y="350" fill="#123524" font-size="19" font-weight="700">Medical</text>
      <text x="390" y="382" fill="#4a5b52" font-size="15">Review DGCA</text>
      <text x="390" y="404" fill="#4a5b52" font-size="15">requirements</text>
    </g>
    <g>
      <rect x="520" y="190" width="196" height="264" rx="18" fill="#fff" stroke="#d8e0da" stroke-width="2"/>
      <circle cx="618" cy="270" r="38" fill="#eef3ef"/>
      <path d="M599 250h38v41h-38zM607 260h22M607 269h22M607 278h15" fill="none" stroke="#1f6f43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="618" y="350" fill="#123524" font-size="19" font-weight="700">Theory</text>
      <text x="618" y="382" fill="#4a5b52" font-size="15">DGCA exams and</text>
      <text x="618" y="404" fill="#4a5b52" font-size="15">radio telephony</text>
    </g>
    <g>
      <rect x="748" y="190" width="196" height="264" rx="18" fill="#fff" stroke="#d8e0da" stroke-width="2"/>
      <circle cx="846" cy="270" r="38" fill="#eef3ef"/>
      <path d="M846 245l7 19 20 7-20 7-7 19-7-19-20-7 20-7z" fill="#1f6f43"/>
      <text x="846" y="350" fill="#123524" font-size="19" font-weight="700">Flight training</text>
      <text x="846" y="382" fill="#4a5b52" font-size="15">At an appropriately</text>
      <text x="846" y="404" fill="#4a5b52" font-size="15">approved FTO</text>
    </g>
    <g>
      <rect x="976" y="190" width="196" height="264" rx="18" fill="#fff" stroke="#d8e0da" stroke-width="2"/>
      <circle cx="1074" cy="270" r="38" fill="#f6e6c8"/>
      <path d="M1056 278l12 12 25-28" fill="none" stroke="#1f6f43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1074" y="350" fill="#123524" font-size="19" font-weight="700">Career planning</text>
      <text x="1074" y="382" fill="#4a5b52" font-size="15">Check ratings, roles</text>
      <text x="1074" y="404" fill="#4a5b52" font-size="15">and hiring terms</text>
    </g>
  </g>
  <text x="64" y="560" fill="#4a5b52" font-family="Arial, sans-serif" font-size="15">Illustrative sequence only. Applicable rules, timing and training contracts vary.</text>
</svg>
