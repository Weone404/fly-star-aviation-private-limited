<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">What DGCA requires before you can appear</text>
<rect x="64" y="150" width="1072" height="40" fill="#eef3ef"/><text x="78" y="177" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">Claim you will see</text><text x="571.12" y="177" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">What actually backs it</text><line x1="64" y1="190" x2="1136" y2="190" stroke="#d8e0da" stroke-width="1"/><text x="78" y="222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#123524" text-anchor="start">A computer number</text><rect x="557.12" y="204" width="4" height="56" fill="#1f6f43"/><text x="575.12" y="222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f6f43" text-anchor="start">Required by the CAR</text><line x1="64" y1="274" x2="1136" y2="274" stroke="#d8e0da" stroke-width="1"/><text x="78" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#123524" text-anchor="start">The educational qualification for your</text><text x="78" y="328" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#123524" text-anchor="start">licence</text><rect x="557.12" y="288" width="4" height="56" fill="#1f6f43"/><text x="575.12" y="306" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1f6f43" text-anchor="start">Required by the CAR</text><line x1="64" y1="358" x2="1136" y2="358" stroke="#d8e0da" stroke-width="1"/><text x="78" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#123524" text-anchor="start">Attendance at a ground school</text><rect x="557.12" y="372" width="4" height="56" fill="#b7791f"/><text x="575.12" y="390" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#b7791f" text-anchor="start">Not on the list</text><line x1="64" y1="442" x2="1136" y2="442" stroke="#d8e0da" stroke-width="1"/><text x="78" y="474" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#123524" text-anchor="start">A DGCA-approved coaching institute</text><rect x="557.12" y="456" width="4" height="56" fill="#b7791f"/><text x="575.12" y="474" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#b7791f" text-anchor="start">DGCA approves and ranks none</text>
<text x="64" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: CAR Section 7, Series B, Part I</text>
