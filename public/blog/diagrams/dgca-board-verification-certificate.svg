<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" width="1200" height="574" role="img" aria-label="Board Verification Certificate: who actually needs one">
<rect width="1200" height="574" fill="#f7f9f7"/>
<rect x="0" y="0" width="1200" height="8" fill="#1f6f43"/>
<rect x="64" y="46" width="54" height="5" rx="2.5" fill="#b7791f"/>
<text x="64" y="96" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#123524" text-anchor="start">Board Verification Certificate: who actually needs one</text>
<rect x="64" y="146" width="1072" height="40" fill="#eef3ef"/><text x="356.72" y="173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">NEW candidate</text><text x="753.36" y="173" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#123524" text-anchor="start">OLD candidate</text><line x1="64" y1="186" x2="1136" y2="186" stroke="#d8e0da" stroke-width="1"/><text x="78" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Definition</text><text x="356.72" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Never allotted a computer number</text><text x="753.36" y="216" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Allotted before the Pariksha portal</text><rect x="64" y="264" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="264" x2="1136" y2="264" stroke="#d8e0da" stroke-width="1"/><text x="78" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Board Verification Certificate</text><text x="356.72" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Mandatory before registration</text><text x="753.36" y="294" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Not required</text><line x1="64" y1="342" x2="1136" y2="342" stroke="#d8e0da" stroke-width="1"/><text x="78" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Hard copy by post</text><text x="356.72" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Required</text><text x="753.36" y="372" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Not required</text><rect x="64" y="420" width="1072" height="78" fill="#ffffff"/><line x1="64" y1="420" x2="1136" y2="420" stroke="#d8e0da" stroke-width="1"/><text x="78" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#123524" text-anchor="start">Profile updates</text><text x="356.72" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Only after the number is allotted</text><text x="753.36" y="450" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#4a5b52" text-anchor="start">Via profile management</text>
<text x="64" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a5b52" text-anchor="start">Source: DGCA Pariksha, Flight Crew registration</text>
</svg>